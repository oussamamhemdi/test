name: integration contenu (projet test)

on:
  push:
    branches: [main]

jobs:
  Build_test_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build frontend
        run: |
          docker build -t oussamamhemdi/angular angular-app
          docker push oussamamhemdi/angular

      - name: build artifact
        run: |
          cd springboot/app
          chmod +x mvnw
          ./mvnw clean package

      - name: build backend
        run: |
          docker build -t oussamamhemdi/spring springboot/app
          docker push oussamamhemdi/spring

      - name: Stop the stack
        if: always()
        run: docker compose down -v
